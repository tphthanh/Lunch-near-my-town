<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hôm Nay Ăn Gì?</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel để dịch JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const FOOD_MENU = [
      { id: 'f1', name: 'Cơm bụi / Cơm rang', price: 50000, category: 'Cơm', profile: 'HEAVY_FAT', calories: '~680 kcal', tag: 'Chắc bụng, nhiều dầu mỡ' },
      { id: 'f2', name: 'Phở bò / Phở gà', price: 50000, category: 'Bún/Phở', profile: 'RED_MEAT', calories: '~520 kcal', tag: 'Nóng hổi, giàu đạm & sắt' },
      { id: 'f3', name: 'Ngan chặt / Ngan nướng', price: 150000, category: 'Đặc sản', profile: 'HIGH_PROTEIN_FAT', calories: '~750 kcal', tag: 'Đậm đà, đạm cao, no lâu' },
      { id: 'f4', name: 'Bún đậu / Bún giả cầy', price: 60000, category: 'Món nước/chấm', profile: 'HIGH_SODIUM_FAT', calories: '~620 kcal', tag: 'Đậm vị, nhiều gia vị mắm' },
      { id: 'f5', name: 'Bún riêu / Bún ngan', price: 50000, category: 'Bún/Phở', profile: 'SAVORY_ACID', calories: '~490 kcal', tag: 'Nước dùng thanh ngọt dễ ăn' },
      { id: 'f6', name: 'Bún chả Hà Nội', price: 50000, category: 'Món nướng', profile: 'SAVORY_GRILLED', calories: '~530 kcal', tag: 'Thịt nướng than hoa thơm lừng' },
      { id: 'f7', name: 'Bún cá chấm', price: 50000, category: 'Đồ chiên', profile: 'FRIED_CRUNCH', calories: '~560 kcal', tag: 'Cá chiên giòn rụm kèm mắm tỏi' },
      { id: 'f8', name: 'Xôi chả trứng', price: 50000, category: 'Xôi', profile: 'HEAVY_CARB', calories: '~600 kcal', tag: 'Nếp dẻo, nhiều tinh bột' },
      { id: 'f9', name: 'Mỳ gà tần', price: 50000, category: 'Mì/Thuốc bắc', profile: 'HERBAL_NOURISH', calories: '~510 kcal', tag: 'Bổ dưỡng, thảo mộc ngải cứu' },
    ];

    const DRINK_MENU = [
      { id: 'd1', name: 'Trà đá / Chè tươi hãm', price: 5000, benefit: 'COOLING_DETOX', goodFor: ['HEAVY_FAT', 'HIGH_SODIUM_FAT', 'SAVORY_GRILLED'], note: 'Giải mặn, sạch miệng, hạ nhiệt tức thì' },
      { id: 'd2', name: 'Nước mía tắc / quất', price: 15000, benefit: 'DIGESTIVE_ACID', goodFor: ['FRIED_CRUNCH', 'SAVORY_GRILLED', 'HIGH_PROTEIN_FAT'], note: 'Chua thanh trợ tiêu hóa đồ chiên/nướng' },
      { id: 'd3', name: 'Trà tắc xí muội', price: 20000, benefit: 'DIGESTIVE_ACID', goodFor: ['HEAVY_FAT', 'HEAVY_CARB'], note: 'Cắt cơn ngấy dầu mỡ và nếp dẻo' },
      { id: 'd4', name: 'Nước ép ổi hồng / Cóc ép', price: 30000, benefit: 'VITAMIN_C', goodFor: ['RED_MEAT'], note: 'Giàu Vitamin C giúp hấp thu tối đa chất sắt' },
      { id: 'd5', name: 'Nước dừa xiêm tươi', price: 35000, benefit: 'ELECTROLYTE', goodFor: ['HIGH_SODIUM_FAT', 'HIGH_PROTEIN_FAT'], note: 'Bù nước, cân bằng lượng muối từ mắm' },
      { id: 'd6', name: 'Trà sen vàng / Trà lài', price: 30000, benefit: 'COOLING_DETOX', goodFor: ['SAVORY_ACID', 'HERBAL_NOURISH'], note: 'Thanh tao, êm dịu dạ dày' },
      { id: 'd7', name: 'Cà phê nâu đá / Bạc xỉu', price: 25000, benefit: 'ENERGY_BOOST', goodFor: ['SAVORY_ACID'], note: 'Nạp năng lượng, tỉnh táo buổi chiều' },
      { id: 'd8', name: 'Sữa hạt đậu nành / Đậu xanh', price: 15000, benefit: 'NOURISH_SMOOTH', goodFor: ['HEAVY_CARB', 'FRIED_CRUNCH'], note: 'Làm dịu hệ tiêu hóa sau món khô/cay' },
      { id: 'd9', name: 'Trà chanh giã tay ít đường', price: 25000, benefit: 'REFRESH_LIGHT', goodFor: ['HEAVY_FAT', 'HIGH_PROTEIN_FAT'], note: 'Tinh dầu chanh tươi sảng khoái, nhẹ bụng' },
    ];

    function App() {
      const [selectedFood, setSelectedFood] = useState(FOOD_MENU[0]);
      const [selectedDrink, setSelectedDrink] = useState(DRINK_MENU[2]);
      const [mode, setMode] = useState('nutrition');
      const [isLocked, setIsLocked] = useState(false);

      const handleSelectFood = (food) => {
        setSelectedFood(food);
        setIsLocked(false);
        if (mode === 'nutrition') {
          const matched = DRINK_MENU.filter(d => d.goodFor && d.goodFor.includes(food.profile));
          setSelectedDrink(matched.length > 0 ? matched[0] : DRINK_MENU[0]);
        }
      };

      const handleRandomizeDrink = () => {
        setIsLocked(false);
        const pool = mode === 'nutrition' 
          ? (DRINK_MENU.filter(d => d.goodFor && d.goodFor.includes(selectedFood.profile)).length > 0
              ? DRINK_MENU.filter(d => d.goodFor && d.goodFor.includes(selectedFood.profile))
              : DRINK_MENU)
          : DRINK_MENU;
        const filtered = pool.filter(d => d.id !== selectedDrink.id);
        const random = filtered[Math.floor(Math.random() * filtered.length)] || pool[0];
        setSelectedDrink(random);
      };

      const isOptimalMatch = selectedDrink.goodFor && selectedDrink.goodFor.includes(selectedFood.profile);

      const getInsightText = () => {
        if (mode === 'wild') return 'Sự kết hợp ngẫu hứng, phá cách không ràng buộc để thử nghiệm khẩu vị mới lạ!';
        if (selectedFood.profile === 'RED_MEAT' && selectedDrink.benefit === 'VITAMIN_C') {
          return `Vitamin C tự nhiên trong ${selectedDrink.name} giúp tăng khả năng hấp thụ sắt từ ${selectedFood.name}.`;
        }
        if ((selectedFood.profile === 'HEAVY_FAT' || selectedFood.profile === 'FRIED_CRUNCH' || selectedFood.profile === 'HEAVY_CARB') && selectedDrink.benefit === 'DIGESTIVE_ACID') {
          return `Vị chua thanh trong ${selectedDrink.name} kích thích tiêu hóa, giảm đáng kể cảm giác ngấy sau khi ăn.`;
        }
        if (selectedFood.profile === 'HIGH_SODIUM_FAT' && (selectedDrink.benefit === 'COOLING_DETOX' || selectedDrink.benefit === 'ELECTROLYTE')) {
          return `Vị thanh mát trong ${selectedDrink.name} giúp giải mặn và bù nước tự nhiên cho cơ thể.`;
        }
        return `Combo cân đối: ${selectedFood.name} no lâu kết hợp ${selectedDrink.name} tươi mát giúp thanh lọc cơ thể.`;
      };

      const handleConfirmCombo = () => {
        setIsLocked(true);
        if (window.confetti) {
          window.confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
        }
      };

      const formatMoney = (val) => new Intl.NumberFormat('vi-VN').format(val) + ' đ';

      return (
        <div className="max-w-5xl mx-auto p-4 md:p-8 space-y-6">
          <header className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-black text-slate-900">🍽️ Hôm Nay Ăn Gì?</h1>
              <p className="text-xs md:text-sm text-slate-500 font-medium">Chọn món chính — Tự động gợi ý thức uống chuẩn dinh dưỡng</p>
            </div>
            <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-2xl">
              <button 
                onClick={() => { setMode('nutrition'); handleSelectFood(selectedFood); }}
                className={`py-2 px-3 rounded-xl text-xs font-black transition-all ${mode === 'nutrition' ? 'bg-emerald-600 text-white shadow' : 'text-slate-600'}`}>
                🛡️ Chuẩn Dinh Dưỡng
              </button>
              <button 
                onClick={() => setMode('wild')}
                className={`py-2 px-3 rounded-xl text-xs font-black transition-all ${mode === 'wild' ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow' : 'text-slate-600'}`}>
                ⚡ Tự Chọn Phá Cách 🎲
              </button>
            </div>
          </header>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 space-y-4">
              <div className="bg-white rounded-3xl p-5 md:p-6 shadow-sm border border-slate-200">
                <h2 className="text-base font-black text-slate-900 mb-4">1. Chọn món ăn trưa:</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                  {FOOD_MENU.map(item => (
                    <button
                      key={item.id}
                      onClick={() => handleSelectFood(item)}
                      className={`text-left p-3.5 rounded-2xl border-2 transition-all flex flex-col justify-between ${selectedFood.id === item.id ? 'border-orange-500 bg-orange-50/50 shadow' : 'border-slate-100 bg-slate-50/50 hover:border-slate-300'}`}>
                      <div>
                        <div className="flex justify-between items-center mb-1">
                          <span className="text-[10px] font-black uppercase text-slate-400 bg-slate-200/60 px-1.5 py-0.5 rounded">{item.category}</span>
                          <span className="text-xs font-black text-orange-600">{formatMoney(item.price)}</span>
                        </div>
                        <h3 className="font-black text-slate-800 text-sm">{item.name}</h3>
                        <p className="text-[11px] text-slate-500 mt-1">{item.tag}</p>
                      </div>
                      <div className="mt-2 pt-2 border-t border-slate-200 text-[11px] text-slate-400 font-medium flex justify-between">
                        <span>🔥 {item.calories}</span>
                        {selectedFood.id === item.id && <span className="text-orange-600 font-bold">✓ Đã chọn</span>}
                      </div>
                    </button>
                  ))}
                </div>
              </div>

              <div className="bg-white rounded-3xl p-5 md:p-6 shadow-sm border border-slate-200">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-base font-black text-slate-900">2. Gợi ý đồ uống đi kèm:</h2>
                  <button onClick={handleRandomizeDrink} className="text-xs font-bold text-cyan-700 bg-cyan-50 px-3 py-1.5 rounded-xl">🔄 Đổi món nước</button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  {DRINK_MENU.map(drink => {
                    const isBest = drink.goodFor && drink.goodFor.includes(selectedFood.profile);
                    const isSelected = selectedDrink.id === drink.id;
                    return (
                      <button
                        key={drink.id}
                        onClick={() => { setSelectedDrink(drink); setIsLocked(false); }}
                        className={`text-left p-3.5 rounded-2xl border-2 transition-all flex flex-col justify-between ${isSelected ? 'border-cyan-600 bg-cyan-50/50 shadow' : isBest && mode === 'nutrition' ? 'border-emerald-300 bg-emerald-50/30' : 'border-slate-100 bg-slate-50/50'}`}>
                        <div>
                          {isBest && mode === 'nutrition' && (
                            <span className="inline-block text-[9px] font-black uppercase text-emerald-800 bg-emerald-100 px-1.5 py-0.5 rounded mb-1">⭐ Tối ưu</span>
                          )}
                          <h3 className="font-black text-slate-800 text-xs">{drink.name}</h3>
                          <p className="text-[11px] text-slate-500 mt-1">{drink.note}</p>
                        </div>
                        <div className="mt-2 pt-2 border-t border-slate-200 text-xs font-black text-cyan-700 flex justify-between">
                          <span>{formatMoney(drink.price)}</span>
                          {isSelected && <span>✓</span>}
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>

            <div>
              <div className={`bg-white rounded-3xl p-6 shadow-xl border-2 sticky top-6 ${isOptimalMatch && mode === 'nutrition' ? 'border-emerald-500' : mode === 'wild' ? 'border-purple-500' : 'border-slate-200'}`}>
                <div className="text-center mb-4">
                  <span className={`inline-block text-xs font-black px-3.5 py-1 rounded-full uppercase ${isOptimalMatch && mode === 'nutrition' ? 'bg-emerald-100 text-emerald-800' : mode === 'wild' ? 'bg-purple-100 text-purple-900' : 'bg-amber-100 text-amber-800'}`}>
                    {mode === 'nutrition' ? (isOptimalMatch ? '🛡️ Chuẩn Dinh Dưỡng' : '✨ Combo Thư Giãn') : '⚡ Tự Chọn Phá Cách'}
                  </span>
                </div>

                <div className="space-y-3 mb-5 text-sm">
                  <div className="p-3 bg-slate-50 rounded-2xl flex justify-between items-center border border-slate-200">
                    <div>
                      <span className="text-[10px] font-black uppercase text-orange-600 bg-orange-100 px-1.5 py-0.5 rounded">Món ăn</span>
                      <p className="font-black text-slate-800 mt-1">{selectedFood.name}</p>
                    </div>
                    <span className="font-bold">{formatMoney(selectedFood.price)}</span>
                  </div>
                  <div className="p-3 bg-slate-50 rounded-2xl flex justify-between items-center border border-slate-200">
                    <div>
                      <span className="text-[10px] font-black uppercase text-cyan-700 bg-cyan-100 px-1.5 py-0.5 rounded">Đồ uống</span>
                      <p className="font-black text-slate-800 mt-1">{selectedDrink.name}</p>
                    </div>
                    <span className="font-bold">{formatMoney(selectedDrink.price)}</span>
                  </div>
                </div>

                <div className="p-3 bg-orange-50 rounded-2xl border border-orange-200 mb-4 flex justify-between items-center">
                  <span className="font-bold text-slate-600 text-xs">Tổng chi phí:</span>
                  <span className="text-lg font-black text-orange-600">{formatMoney(selectedFood.price + selectedDrink.price)}</span>
                </div>

                <div className="p-3 bg-slate-100 rounded-2xl text-xs text-slate-600 mb-5 border border-slate-200">
                  {getInsightText()}
                </div>

                <button
                  onClick={handleConfirmCombo}
                  className={`w-full py-3.5 text-white font-black text-sm rounded-2xl shadow-lg transition-all ${isLocked ? 'bg-emerald-600' : 'bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600'}`}>
                  {isLocked ? '🎉 Đã Chốt Combo!' : '✨ Chốt Combo Trưa Nay'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
