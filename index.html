<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hôm Nay Ăn Gì? - Vòng Quay Phá Cách & Chọn Món</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    .wheel-container {
      transition: transform 4s cubic-bezier(0.15, 0.9, 0.25, 1);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    const FOOD_MENU = [
      { id: 'f1', name: 'Cơm bụi / Cơm rang', price: 50000, category: 'Cơm', profile: 'HEAVY_FAT', calories: '~680 kcal', tag: 'Chắc bụng, nhiều dầu mỡ', color: '#FF7043' },
      { id: 'f2', name: 'Phở bò / Phở gà', price: 50000, category: 'Bún/Phở', profile: 'RED_MEAT', calories: '~520 kcal', tag: 'Nóng hổi, giàu đạm & sắt', color: '#FFA726' },
      { id: 'f3', name: 'Ngan chặt / Ngan nướng', price: 150000, category: 'Đặc sản', profile: 'HIGH_PROTEIN_FAT', calories: '~750 kcal', tag: 'Đậm đà, đạm cao, no lâu', color: '#AB47BC' },
      { id: 'f4', name: 'Bún đậu / Bún giả cầy', price: 60000, category: 'Món nước/chấm', profile: 'HIGH_SODIUM_FAT', calories: '~620 kcal', tag: 'Đậm vị, nhiều gia vị mắm', color: '#26A69A' },
      { id: 'f5', name: 'Bún riêu / Bún ngan', price: 50000, category: 'Bún/Phở', profile: 'SAVORY_ACID', calories: '~490 kcal', tag: 'Nước dùng thanh ngọt dễ ăn', color: '#EF5350' },
      { id: 'f6', name: 'Bún chả Hà Nội', price: 50000, category: 'Món nướng', profile: 'SAVORY_GRILLED', calories: '~530 kcal', tag: 'Thịt nướng than hoa thơm lừng', color: '#8D6E63' },
      { id: 'f7', name: 'Bún cá chấm', price: 50000, category: 'Đồ chiên', profile: 'FRIED_CRUNCH', calories: '~560 kcal', tag: 'Cá chiên giòn rụm kèm mắm tỏi', color: '#42A5F5' },
      { id: 'f8', name: 'Xôi chả trứng', price: 50000, category: 'Xôi', profile: 'HEAVY_CARB', calories: '~600 kcal', tag: 'Nếp dẻo, nhiều tinh bột', color: '#FFCA28' },
      { id: 'f9', name: 'Mỳ gà tần', price: 50000, category: 'Mì/Thuốc bắc', profile: 'HERBAL_NOURISH', calories: '~510 kcal', tag: 'Bổ dưỡng, thảo mộc ngải cứu', color: '#66BB6A' },
    ];

    const DRINK_MENU = [
      { id: 'd1', name: 'Trà đá / Chè tươi hãm', price: 5000, benefit: 'COOLING_DETOX', goodFor: ['HEAVY_FAT', 'HIGH_SODIUM_FAT', 'SAVORY_GRILLED'], note: 'Giải mặn, sạch miệng, hạ nhiệt tức thì', color: '#81C784' },
      { id: 'd2', name: 'Nước mía tắc / quất', price: 15000, benefit: 'DIGESTIVE_ACID', goodFor: ['FRIED_CRUNCH', 'SAVORY_GRILLED', 'HIGH_PROTEIN_FAT'], note: 'Chua thanh trợ tiêu hóa đồ chiên/nướng', color: '#AED581' },
      { id: 'd3', name: 'Trà tắc xí muội', price: 20000, benefit: 'DIGESTIVE_ACID', goodFor: ['HEAVY_FAT', 'HEAVY_CARB'], note: 'Cắt cơn ngấy dầu mỡ và nếp dẻo', color: '#FFB74D' },
      { id: 'd4', name: 'Nước ép ổi / Cóc ép', price: 30000, benefit: 'VITAMIN_C', goodFor: ['RED_MEAT'], note: 'Giàu Vitamin C giúp hấp thu tối đa chất sắt', color: '#F06292' },
      { id: 'd5', name: 'Nước dừa xiêm tươi', price: 35000, benefit: 'ELECTROLYTE', goodFor: ['HIGH_SODIUM_FAT', 'HIGH_PROTEIN_FAT'], note: 'Bù nước, cân bằng lượng muối từ mắm', color: '#4DD0E1' },
      { id: 'd6', name: 'Trà sen vàng / Trà lài', price: 30000, benefit: 'COOLING_DETOX', goodFor: ['SAVORY_ACID', 'HERBAL_NOURISH'], note: 'Thanh tao, êm dịu dạ dày', color: '#FFF176' },
      { id: 'd7', name: 'Cà phê nâu / Bạc xỉu', price: 25000, benefit: 'ENERGY_BOOST', goodFor: ['SAVORY_ACID'], note: 'Nạp năng lượng, tỉnh táo buổi chiều', color: '#A1887F' },
      { id: 'd8', name: 'Sữa hạt đậu nành', price: 15000, benefit: 'NOURISH_SMOOTH', goodFor: ['HEAVY_CARB', 'FRIED_CRUNCH'], note: 'Làm dịu hệ tiêu hóa sau món khô/cay', color: '#E0E0E0' },
      { id: 'd9', name: 'Trà chanh giã tay', price: 25000, benefit: 'REFRESH_LIGHT', goodFor: ['HEAVY_FAT', 'HIGH_PROTEIN_FAT'], note: 'Tinh dầu chanh tươi sảng khoái, nhẹ bụng', color: '#64B5F6' },
    ];

    // Vẽ hình quạt của vòng tròn SVG
    function renderWheelSlices(items) {
      const total = items.length;
      const angle = 360 / total;
      return items.map((item, idx) => {
        const startAngle = idx * angle - 90;
        const endAngle = (idx + 1) * angle - 90;
        const x1 = 150 + 140 * Math.cos(Math.PI * startAngle / 180);
        const y1 = 150 + 140 * Math.sin(Math.PI * startAngle / 180);
        const x2 = 150 + 140 * Math.cos(Math.PI * endAngle / 180);
        const y2 = 150 + 140 * Math.sin(Math.PI * endAngle / 180);
        const pathData = `M 150 150 L ${x1} ${y1} A 140 140 0 0 1 ${x2} ${y2} Z`;

        const textAngle = startAngle + angle / 2;
        const rad = Math.PI * textAngle / 180;
        const tx = 150 + 95 * Math.cos(rad);
        const ty = 150 + 95 * Math.sin(rad);

        return (
          <g key={item.id}>
            <path d={pathData} fill={item.color} stroke="#ffffff" strokeWidth="2" />
            <text
              x={tx}
              y={ty}
              fill="#ffffff"
              fontSize="10"
              fontWeight="bold"
              textAnchor="middle"
              dominantBaseline="middle"
              transform={`rotate(${textAngle + 90}, ${tx}, ${ty})`}
              className="select-none pointer-events-none drop-shadow"
            >
              {item.name.length > 12 ? item.name.substring(0, 11) + '..' : item.name}
            </text>
          </g>
        );
      });
    }

    function App() {
      const [selectedFood, setSelectedFood] = useState(FOOD_MENU[0]);
      const [selectedDrink, setSelectedDrink] = useState(DRINK_MENU[2]);
      const [mode, setMode] = useState('nutrition'); // 'nutrition' | 'wild'
      const [isSpinning, setIsSpinning] = useState(false);
      const [isLocked, setIsLocked] = useState(false);

      const [foodRotation, setFoodRotation] = useState(0);
      const [drinkRotation, setDrinkRotation] = useState(0);

      // Âm thanh
      const playTickSound = () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(550, ctx.currentTime);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } catch(e) {}
      };

      // Chọn món trực tiếp ở tab Dinh Dưỡng
      const handleSelectFood = (food) => {
        if (isSpinning) return;
        setSelectedFood(food);
        setIsLocked(false);
        const matched = DRINK_MENU.filter(d => d.goodFor && d.goodFor.includes(food.profile));
        setSelectedDrink(matched.length > 0 ? matched[0] : DRINK_MENU[0]);
      };

      // Quay Vòng Quay Tròn Phá Cách
      const handleSpinWheel = () => {
        if (isSpinning) return;
        setIsSpinning(true);
        setIsLocked(false);

        // Chọn ngẫu nhiên index đích (0 - 8)
        const targetFoodIdx = Math.floor(Math.random() * FOOD_MENU.length);
        const targetDrinkIdx = Math.floor(Math.random() * DRINK_MENU.length);

        const sliceAngle = 360 / 9; // 40 độ mỗi ô
        
        // Kim ở góc 0 độ (hướng 12 giờ)
        // Ô i nằm từ i*40 - 90 đến (i+1)*40 - 90. Tâm ô: i*40 - 70
        // Góc quay = Vòng cũ + Số vòng tối thiểu (5-7 vòng) + góc bù để kim chỉ đúng tâm ô
        const extraFoodRounds = 360 * (5 + Math.floor(Math.random() * 2));
        const extraDrinkRounds = 360 * (6 + Math.floor(Math.random() * 2));

        const targetFoodAngle = 360 - (targetFoodIdx * sliceAngle + sliceAngle / 2);
        const targetDrinkAngle = 360 - (targetDrinkIdx * sliceAngle + sliceAngle / 2);

        const newFoodRot = foodRotation + extraFoodRounds + (targetFoodAngle - (foodRotation % 360) + 360) % 360;
        const newDrinkRot = drinkRotation + extraDrinkRounds + (targetDrinkAngle - (drinkRotation % 360) + 360) % 360;

        setFoodRotation(newFoodRot);
        setDrinkRotation(newDrinkRot);

        // Hiệu ứng âm thanh nhịp nháy trong khi quay
        let tickInterval = setInterval(() => {
          playTickSound();
        }, 120);

        setTimeout(() => {
          clearInterval(tickInterval);
          setSelectedFood(FOOD_MENU[targetFoodIdx]);
          setSelectedDrink(DRINK_MENU[targetDrinkIdx]);
          setIsSpinning(false);

          if (window.confetti) {
            window.confetti({ particleCount: 70, spread: 70, origin: { y: 0.6 } });
          }
        }, 4000);
      };

      const handleConfirmCombo = () => {
        setIsLocked(true);
        if (window.confetti) {
          window.confetti({ particleCount: 110, spread: 85, origin: { y: 0.6 } });
        }
      };

      const isOptimalMatch = selectedDrink.goodFor && selectedDrink.goodFor.includes(selectedFood.profile);

      const getInsightText = () => {
        if (mode === 'wild') return 'Combo vòng quay ngẫu hứng hoàn toàn! Sự bất quy tắc mang lại khẩu vị mới lạ, vui vẻ cho bữa trưa.';
        if (selectedFood.profile === 'RED_MEAT' && selectedDrink.benefit === 'VITAMIN_C') {
          return `Vitamin C tự nhiên từ ${selectedDrink.name} giúp tăng khả năng hấp thu chất sắt từ ${selectedFood.name}.`;
        }
        if ((selectedFood.profile === 'HEAVY_FAT' || selectedFood.profile === 'FRIED_CRUNCH' || selectedFood.profile === 'HEAVY_CARB') && selectedDrink.benefit === 'DIGESTIVE_ACID') {
          return `Vị chua thanh trong ${selectedDrink.name} kích thích men tiêu hóa lipid, chống đầy bụng hiệu quả.`;
        }
        if (selectedFood.profile === 'HIGH_SODIUM_FAT' && (selectedDrink.benefit === 'COOLING_DETOX' || selectedDrink.benefit === 'ELECTROLYTE')) {
          return `Độ thanh mát của ${selectedDrink.name} giúp giải mặn và bù nước tự nhiên sau món nhiều mắm.`;
        }
        return `Combo cân đối: ${selectedFood.name} no lâu kết hợp ${selectedDrink.name} thanh lọc cơ thể.`;
      };

      const formatMoney = (val) => new Intl.NumberFormat('vi-VN').format(val) + ' đ';

      return (
        <div className="max-w-5xl mx-auto p-4 md:p-8 space-y-6">
          
          {/* Header */}
          <header className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-black text-slate-900 flex items-center gap-2">
                <span>🍽️</span> Hôm Nay Ăn Gì?
              </h1>
              <p className="text-xs md:text-sm text-slate-500 font-medium mt-0.5">
                Chọn món dinh dưỡng hoặc quay vòng quay tròn phá cách
              </p>
            </div>

            {/* Chuyển tab */}
            <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-2xl w-full sm:w-auto">
              <button 
                onClick={() => { setMode('nutrition'); handleSelectFood(selectedFood); }}
                className={`py-2 px-4 rounded-xl text-xs font-black transition-all ${
                  mode === 'nutrition' 
                    ? 'bg-emerald-600 text-white shadow-sm' 
                    : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                🛡️ Chuẩn Dinh Dưỡng
              </button>

              <button 
                onClick={() => setMode('wild')}
                className={`py-2 px-4 rounded-xl text-xs font-black transition-all ${
                  mode === 'wild' 
                    ? 'bg-gradient-to-r from-purple-600 via-pink-600 to-amber-500 text-white shadow-sm' 
                    : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                🎲 Vòng Quay Phá Cách
              </button>
            </div>
          </header>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            {/* Cột Trái: Hiển thị Vòng Quay Tròn HOẶC Lưới Chọn Món */}
            <div className="lg:col-span-2 space-y-5">
              
              {mode === 'wild' ? (
                /* GIAO DIỆN VÒNG QUAY TRÒN PHÁ CÁCH */
                <div className="bg-white rounded-3xl p-6 shadow-sm border-2 border-purple-200 text-center space-y-6">
                  <div>
                    <span className="inline-block bg-purple-100 text-purple-800 text-xs font-black px-3 py-1 rounded-full uppercase tracking-wider mb-2">
                      🎲 Vòng Quay Đôi Ngẫu Hứng
                    </span>
                    <h2 className="text-lg font-black text-slate-800">
                      Chạm để quay 2 vòng tròn cùng lúc!
                    </h2>
                    <p className="text-xs text-slate-400 mt-0.5">Vòng trái: Món ăn • Vòng phải: Đồ uống</p>
                  </div>

                  {/* 2 Vòng quay tròn SVG */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 items-center justify-center pt-2">
                    
                    {/* Vòng quay Món Ăn */}
                    <div className="flex flex-col items-center">
                      <span className="text-xs font-black text-orange-600 bg-orange-100 px-3 py-1 rounded-full mb-3">
                        Vòng 1: Món Ăn
                      </span>
                      <div className="relative w-64 h-64">
                        {/* Kim chỉ vị trí (12h) */}
                        <div className="absolute top-0 left-1/2 -translate-x-1/2 -mt-3 z-20 w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[20px] border-t-red-600 drop-shadow-md"></div>

                        {/* Vòng tròn SVG xoay */}
                        <div 
                          className="w-full h-full wheel-container rounded-full shadow-lg border-4 border-white"
                          style={{ transform: `rotate(${foodRotation}deg)` }}
                        >
                          <svg viewBox="0 0 300 300" className="w-full h-full">
                            {renderWheelSlices(FOOD_MENU)}
                            <circle cx="150" cy="150" r="22" fill="#ffffff" />
                            <circle cx="150" cy="150" r="16" fill="#FF7043" />
                          </svg>
                        </div>
                      </div>
                    </div>

                    {/* Vòng quay Đồ Uống */}
                    <div className="flex flex-col items-center">
                      <span className="text-xs font-black text-cyan-700 bg-cyan-100 px-3 py-1 rounded-full mb-3">
                        Vòng 2: Đồ Uống
                      </span>
                      <div className="relative w-64 h-64">
                        {/* Kim chỉ vị trí (12h) */}
                        <div className="absolute top-0 left-1/2 -translate-x-1/2 -mt-3 z-20 w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[20px] border-t-red-600 drop-shadow-md"></div>

                        {/* Vòng tròn SVG xoay */}
                        <div 
                          className="w-full h-full wheel-container rounded-full shadow-lg border-4 border-white"
                          style={{ transform: `rotate(${drinkRotation}deg)` }}
                        >
                          <svg viewBox="0 0 300 300" className="w-full h-full">
                            {renderWheelSlices(DRINK_MENU)}
                            <circle cx="150" cy="150" r="22" fill="#ffffff" />
                            <circle cx="150" cy="150" r="16" fill="#00ACC1" />
                          </svg>
                        </div>
                      </div>
                    </div>

                  </div>

                  {/* Nút Quay Lớn */}
                  <div className="pt-2">
                    <button
                      disabled={isSpinning}
                      onClick={handleSpinWheel}
                      className="px-10 py-4 bg-gradient-to-r from-purple-600 via-pink-600 to-orange-500 hover:from-purple-700 hover:to-orange-600 text-white font-black text-base rounded-2xl shadow-xl shadow-purple-500/25 transition-all active:scale-95 disabled:opacity-50 flex items-center justify-center gap-2 mx-auto"
                    >
                      <span className={isSpinning ? 'animate-spin inline-block' : ''}>🎲</span>
                      {isSpinning ? 'Đang quay cả 2 vòng...' : 'Quay Vòng May Mắn Ngay!'}
                    </button>
                  </div>
                </div>
              ) : (
                /* GIAO DIỆN CHỌN MÓN CHUẨN DINH DƯỠNG */
                <div className="space-y-5">
                  <div className="bg-white rounded-3xl p-5 md:p-6 shadow-sm border border-slate-200">
                    <div className="flex items-center justify-between mb-4">
                      <h2 className="text-base font-black text-slate-900 flex items-center gap-2">
                        <span className="w-6 h-6 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center text-xs font-black">1</span>
                        Chọn món ăn trưa của bạn:
                      </h2>
                      <span className="text-xs text-slate-400 font-semibold">9 món</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                      {FOOD_MENU.map(item => (
                        <button
                          key={item.id}
                          onClick={() => handleSelectFood(item)}
                          className={`text-left p-3.5 rounded-2xl border-2 transition-all flex flex-col justify-between ${
                            selectedFood.id === item.id 
                              ? 'border-orange-500 bg-orange-50/60 shadow-sm' 
                              : 'border-slate-100 bg-slate-50/60 hover:border-slate-300'
                          }`}
                        >
                          <div>
                            <div className="flex justify-between items-center mb-1">
                              <span className="text-[10px] font-black uppercase text-slate-400 bg-slate-200/60 px-1.5 py-0.5 rounded">{item.category}</span>
                              <span className="text-xs font-black text-orange-600">{formatMoney(item.price)}</span>
                            </div>
                            <h3 className="font-black text-slate-800 text-sm leading-snug">{item.name}</h3>
                            <p className="text-[11px] text-slate-500 mt-1">{item.tag}</p>
                          </div>
                          <div className="mt-2.5 pt-2 border-t border-slate-200/80 text-[11px] text-slate-400 font-medium flex justify-between">
                            <span>🔥 {item.calories}</span>
                            {selectedFood.id === item.id && <span className="text-orange-600 font-bold">✓ Đã chọn</span>}
                          </div>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="bg-white rounded-3xl p-5 md:p-6 shadow-sm border border-slate-200">
                    <div className="flex justify-between items-center mb-4">
                      <h2 className="text-base font-black text-slate-900 flex items-center gap-2">
                        <span className="w-6 h-6 bg-cyan-100 text-cyan-700 rounded-full flex items-center justify-center text-xs font-black">2</span>
                        Đồ uống tối ưu dinh dưỡng:
                      </h2>
                      <span className="text-xs text-slate-400 font-semibold">9 loại</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      {DRINK_MENU.map(drink => {
                        const isBest = drink.goodFor && drink.goodFor.includes(selectedFood.profile);
                        const isSelected = selectedDrink.id === drink.id;

                        return (
                          <button
                            key={drink.id}
                            onClick={() => { setSelectedDrink(drink); setIsLocked(false); }}
                            className={`text-left p-3.5 rounded-2xl border-2 transition-all flex flex-col justify-between ${
                              isSelected 
                                ? 'border-cyan-600 bg-cyan-50/60 shadow-sm' 
                                : isBest 
                                ? 'border-emerald-300 bg-emerald-50/30 hover:border-emerald-400' 
                                : 'border-slate-100 bg-slate-50/60 hover:border-slate-300'
                            }`}
                          >
                            <div>
                              {isBest && (
                                <span className="inline-block text-[9px] font-black uppercase text-emerald-800 bg-emerald-100 px-1.5 py-0.5 rounded mb-1">
                                  ⭐ Cặp đôi tối ưu
                                </span>
                              )}
                              <h3 className="font-black text-slate-800 text-xs leading-snug">{drink.name}</h3>
                              <p className="text-[11px] text-slate-500 mt-1 line-clamp-2">{drink.note}</p>
                            </div>
                            <div className="mt-2 pt-2 border-t border-slate-200/80 text-xs font-black text-cyan-700 flex justify-between">
                              <span>{formatMoney(drink.price)}</span>
                              {isSelected && <span>✓</span>}
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

            </div>

            {/* Cột Phải: Bảng Kết Quả / Hóa Đơn */}
            <div>
              <div className={`bg-white rounded-3xl p-6 shadow-xl border-2 sticky top-6 transition-all ${
                isOptimalMatch && mode === 'nutrition' 
                  ? 'border-emerald-500' 
                  : mode === 'wild' 
                  ? 'border-purple-500' 
                  : 'border-slate-200'
              }`}>
                
                {/* Badge Trạng Thái */}
                <div className="text-center mb-4">
                  {mode === 'nutrition' ? (
                    <span className={`inline-block text-xs font-black px-3.5 py-1 rounded-full uppercase ${
                      isOptimalMatch ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                    }`}>
                      {isOptimalMatch ? '🛡️ Chuẩn Dinh Dưỡng' : '✨ Combo Thư Giãn'}
                    </span>
                  ) : (
                    <span className="inline-flex items-center gap-1.5 text-xs font-black px-3.5 py-1 rounded-full uppercase bg-gradient-to-r from-purple-100 to-pink-100 text-purple-900 border border-purple-200">
                      <span>🎲</span> Vòng Quay Phá Cách
                    </span>
                  )}
                </div>

                {/* Khung Món đã chốt */}
                <div className="space-y-3 mb-5 text-sm">
                  <div className="p-3.5 bg-slate-50 rounded-2xl flex justify-between items-center border border-slate-200">
                    <div>
                      <span className="text-[10px] font-black uppercase text-orange-600 bg-orange-100 px-2 py-0.5 rounded">Món chính</span>
                      <p className="font-black text-slate-800 mt-1 text-sm">{selectedFood.name}</p>
                    </div>
                    <span className="font-bold text-slate-700">{formatMoney(selectedFood.price)}</span>
                  </div>

                  <div className="p-3.5 bg-slate-50 rounded-2xl flex justify-between items-center border border-slate-200">
                    <div>
                      <span className="text-[10px] font-black uppercase text-cyan-700 bg-cyan-100 px-2 py-0.5 rounded">Đồ uống</span>
                      <p className="font-black text-slate-800 mt-1 text-sm">{selectedDrink.name}</p>
                    </div>
                    <span className="font-bold text-slate-700">{formatMoney(selectedDrink.price)}</span>
                  </div>
                </div>

                {/* Tổng tiền */}
                <div className="p-3.5 bg-orange-50 rounded-2xl border border-orange-200 mb-4 flex justify-between items-center">
                  <span className="font-bold text-slate-600 text-xs">Tổng bữa trưa:</span>
                  <span className="text-xl font-black text-orange-600">
                    {formatMoney(selectedFood.price + selectedDrink.price)}
                  </span>
                </div>

                {/* Phân tích lợi ích */}
                <div className="p-3.5 bg-slate-100 rounded-2xl text-xs text-slate-600 mb-5 border border-slate-200 leading-relaxed">
                  {getInsightText()}
                </div>

                {/* Nút Chốt Món */}
                <button
                  disabled={isSpinning}
                  onClick={handleConfirmCombo}
                  className={`w-full py-4 text-white font-black text-sm rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 active:scale-95 disabled:opacity-50 ${
                    isLocked ? 'bg-emerald-600' : 'bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600'
                  }`}
                >
                  {isLocked ? '🎉 Đã Chốt Combo Này!' : '✨ Chốt Combo Trưa Nay'}
                </button>

              </div>
            </div>

          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
